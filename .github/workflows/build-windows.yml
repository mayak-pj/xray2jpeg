name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      XRAY2JPEG_VIPS_DIR: ${{ github.workspace }}\build\vips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch libvips (pinned, sha256)
        run: python scripts/fetch_libvips.py --dest build/vips

      - name: Check libvips DLL imports for Windows 7
        run: python scripts/check_pe_imports.py build/vips

      - name: Tests
        run: python -m pytest -q

      - name: Build smoke exe
        run: python -m PyInstaller packaging/smoke.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Check bundle imports for Windows 7
        run: python scripts/check_pe_imports.py dist/Xray2JpegSmoke --report dist/Xray2JpegSmoke/pe_imports_report.txt

      - name: Run smoke checks headless
        shell: pwsh
        env:
          # Собранный exe обязан брать DLL из своей сборки, а не из build/vips.
          XRAY2JPEG_VIPS_DIR: ""
        run: |
          if (Test-Path dist\Xray2JpegSmoke\_internal\ucrtbase.dll) { throw "ucrtbase.dll попал в сборку" }
          Write-Host ("DLL libvips в сборке: " + (Get-ChildItem dist\Xray2JpegSmoke\_internal\vips\*.dll).Count)
          $process = Start-Process -FilePath dist\Xray2JpegSmoke\Xray2JpegSmoke.exe -ArgumentList "--no-gui" -Wait -PassThru
          Get-Content -Encoding UTF8 dist\Xray2JpegSmoke\smoke_report.txt
          Remove-Item dist\Xray2JpegSmoke\smoke_report.txt
          exit $process.ExitCode

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\Xray2JpegSmoke -DestinationPath Xray2JpegSmoke-win7-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Xray2JpegSmoke-win7-x64
          path: Xray2JpegSmoke-win7-x64.zip
